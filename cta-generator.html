<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Free CTA Generator by CreatorKit. Generate calls to action for videos and social media."
  >

  <title>CTA Generator — CreatorKit</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

<header>

  <div class="nav">

    <a class="logo" href="/creatorkit/">
      Creator<span>Kit</span>
    </a>

    <a class="nav-btn" href="/creatorkit/">
      Home
    </a>

  </div>

</header>


<main>

<section class="tool-page">

  <div class="badge">
    📣 FREE CREATOR TOOL
  </div>

  <h1>
    CTA Generator
  </h1>

  <p class="description">
    Generate calls-to-action that encourage viewers to like, follow, comment and subscribe.
  </p>


  <div class="card">

    <input
      id="topic"
      type="text"
      placeholder="e.g. gaming video"
    >

    <button onclick="generateCTA()">
      Generate CTAs
    </button>

    <div
      id="result"
      class="result"
    ></div>

  </div>

</section>

</main>


<footer>

  <p>
    © 2026 CreatorKit · Free tools for creators
  </p>

</footer>


<script>

function generateCTA() {

  const topic =
    document
      .getElementById("topic")
      .value
      .trim() || "this content";


  const ctas = [

    `🔥 Enjoyed ${topic}? Hit Like and Subscribe!`,

    `💬 What do you think about ${topic}? Tell me in the comments!`,

    `🚀 Follow for more content like this!`,

    `❤️ Like this if you want to see more!`,

    `🔔 Subscribe and turn on notifications for the next video!`,

    `👇 Comment your favorite part below!`,

    `🎯 Follow the journey for more ${topic} content!`,

    `📲 Share this with someone who needs to see it!`

  ];


  const result =
    document.getElementById("result");


  result.innerHTML =
    ctas.join("<br><br>") +
    '<br><button class="copy-btn" onclick="copyResult()">📋 Copy Result</button>';

}


function copyResult() {

  const result =
    document.getElementById("result");

  const text =
    result.innerText
      .replace("📋 Copy Result", "")
      .trim();

  navigator.clipboard.writeText(text);

  const button =
    result.querySelector(".copy-btn");

  button.textContent =
    "✓ Copied!";

  setTimeout(() => {

    button.textContent =
      "📋 Copy Result";

  }, 1800);

}

</script>

</body>
</html>
