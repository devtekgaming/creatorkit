<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Contact Us | DEVTEKVAULT</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #0b0b12;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 600px;
      background: #151522;
      padding: 35px;
      border-radius: 18px;
      box-shadow: 0 0 30px rgba(120, 80, 255, 0.25);
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
      font-size: 32px;
    }

    .subtitle {
      text-align: center;
      color: #aaa;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input,
    textarea {
      width: 100%;
      padding: 14px;
      margin-bottom: 20px;
      border: 1px solid #33334a;
      border-radius: 10px;
      background: #0e0e18;
      color: white;
      outline: none;
      font-size: 15px;
    }

    input:focus,
    textarea:focus {
      border-color: #7c4dff;
    }

    textarea {
      height: 150px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #7c4dff;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #6938e8;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #aaa;
      text-decoration: none;
    }

    .back:hover {
      color: white;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Contact Us</h1>

    <p class="subtitle">
      Have a question or need help? Send us a message.
    </p>

    <form action="https://formsubmit.co/devtekgaming@gmail.com" method="POST">

      <input type="hidden" name="_subject" value="New DEVTEKVAULT Contact Message">

      <input type="hidden" name="_captcha" value="false">

      <label for="name">Your Name</label>
      <input
        type="text"
        id="name"
        name="name"
        placeholder="Enter your name"
        required
      >

      <label for="email">Your Email</label>
      <input
        type="email"
        id="email"
        name="email"
        placeholder="Enter your email"
        required
      >

      <label for="message">Message</label>
      <textarea
        id="message"
        name="message"
        placeholder="Write your message..."
        required
      ></textarea>

      <button type="submit">
        Send Message
      </button>

    </form>

    <a href="index.html" class="back">
      ← Back to DEVTEKVAULT
    </a>

  </div>

</body>
</html>
