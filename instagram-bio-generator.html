<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Free Instagram Bio Generator by CreatorKit."
  >

  <title>Instagram Bio Generator — CreatorKit</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

<header>

  <div class="nav">

    <a class="logo" href="/creatorkit/">
      Creator<span>Kit</span>
    </a>

    <a class="nav-btn" href="/creatorkit/">
      Home
    </a>

  </div>

</header>


<main>

<section class="tool-page">

  <div class="badge">
    📱 FREE CREATOR TOOL
  </div>

  <h1>
    Instagram Bio Generator
  </h1>

  <p class="description">
    Generate creative Instagram bio ideas for creators, gamers and brands.
  </p>


  <div class="card">

    <input
      id="topic"
      type="text"
      placeholder="e.g. gaming creator"
    >

    <button onclick="generateBio()">
      Generate Bios
    </button>

    <div
      id="result"
      class="result"
    ></div>

  </div>

</section>

</main>


<footer>

  <p>
    © 2026 CreatorKit · Free tools for creators
  </p>

</footer>


<script>

function generateBio() {

  const topic =
    document
      .getElementById("topic")
      .value
      .trim() || "content creator";


  const bios = [

    `🎮 ${topic} | Creating. Gaming. Growing. 🚀`,

    `⚡ ${topic}\n🎬 New content regularly\n👇 Follow the journey`,

    `🔥 ${topic}\n🎥 Videos • Shorts • Reels\n🚀 Creating every day`,

    `🎮 Creator | Gamer | Dreamer\n✨ ${topic}\n📩 Collabs welcome`,

    `🚀 Building my creator journey\n🎬 ${topic}\n❤️ Thanks for being here`

  ];


  const result =
    document.getElementById("result");


  result.innerHTML =
    bios
      .join("<br><br>")
      .replace(/\n/g, "<br>") +
    '<br><button class="copy-btn" onclick="copyResult()">📋 Copy Result</button>';

}


function copyResult() {

  const result =
    document.getElementById("result");

  const text =
    result.innerText
      .replace("📋 Copy Result", "")
      .trim();

  navigator.clipboard.writeText(text);

  const button =
    result.querySelector(".copy-btn");

  button.textContent = "✓ Copied!";

  setTimeout(() => {

    button.textContent =
      "📋 Copy Result";

  }, 1800);

}

</script>

</body>
</html>
