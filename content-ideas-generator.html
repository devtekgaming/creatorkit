<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Free Content Ideas Generator by CreatorKit."
  >

  <title>Content Ideas Generator — CreatorKit</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

<header>

  <div class="nav">

    <a class="logo" href="/creatorkit/">
      Creator<span>Kit</span>
    </a>

    <a class="nav-btn" href="/creatorkit/">
      Home
    </a>

  </div>

</header>


<main>

<section class="tool-page">

  <div class="badge">
    💡 FREE CREATOR TOOL
  </div>

  <h1>
    Content Ideas Generator
  </h1>

  <p class="description">
    Generate fresh content ideas for YouTube, Instagram, Shorts and Reels.
  </p>


  <div class="card">

    <input
      id="topic"
      type="text"
      placeholder="e.g. gaming"
    >

    <button onclick="generateIdeas()">
      Generate Ideas
    </button>

    <div
      id="result"
      class="result"
    ></div>

  </div>

</section>

</main>


<footer>

  <p>
    © 2026 CreatorKit · Free tools for creators
  </p>

</footer>


<script>

function generateIdeas() {

  const topic =
    document
      .getElementById("topic")
      .value
      .trim() || "your niche";


  const ideas = [

    `🎬 1. Beginner's Guide to ${topic}`,

    `🔥 2. 5 Things Nobody Tells You About ${topic}`,

    `💡 3. Common Mistakes People Make With ${topic}`,

    `⚡ 4. ${topic} Tips That Actually Work`,

    `👀 5. I Tried ${topic} for 7 Days`,

    `🏆 6. Best ${topic} Setup for Beginners`,

    `🚨 7. Things I Wish I Knew Before Starting ${topic}`,

    `📊 8. ${topic}: What Changed This Year?`,

    `🎯 9. ${topic} Challenge`,

    `💬 10. My Honest Opinion About ${topic}`

  ];


  const result =
    document.getElementById("result");


  result.innerHTML =
    ideas.join("<br><br>") +
    '<br><button class="copy-btn" onclick="copyResult()">📋 Copy Result</button>';

}


function copyResult() {

  const result =
    document.getElementById("result");

  const text =
    result.innerText
      .replace("📋 Copy Result", "")
      .trim();

  navigator.clipboard.writeText(text);

  const button =
    result.querySelector(".copy-btn");

  button.textContent =
    "✓ Copied!";

  setTimeout(() => {

    button.textContent =
      "📋 Copy Result";

  }, 1800);

}

</script>

</body>
</html>
