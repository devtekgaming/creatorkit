<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Free YouTube Description Generator by CreatorKit. Create descriptions for YouTube videos and Shorts."
  >

  <title>YouTube Description Generator — CreatorKit</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

<header>

  <div class="nav">

    <a class="logo" href="/creatorkit/">
      Creator<span>Kit</span>
    </a>

    <a class="nav-btn" href="/creatorkit/">
      Home
    </a>

  </div>

</header>


<main>

<section class="tool-page">

  <div class="badge">
    📝 FREE CREATOR TOOL
  </div>

  <h1>
    YouTube Description Generator
  </h1>

  <p class="description">
    Create ready-to-edit YouTube descriptions for videos, Shorts and gaming content.
  </p>


  <div class="card">

    <input
      id="topic"
      type="text"
      placeholder="e.g. gaming monitor unboxing"
    >

    <button onclick="generateDescription()">
      Generate Description
    </button>

    <div
      id="result"
      class="result"
    ></div>

  </div>

</section>

</main>


<footer>

  <p>
    © 2026 CreatorKit · Free tools for creators
  </p>

</footer>


<script>

function generateDescription() {

  const topic =
    document
      .getElementById("topic")
      .value
      .trim() || "this video";


  const description =

`🔥 Thanks for watching!

In this video, we're checking out ${topic} and sharing everything you need to know.

If you enjoyed the video:

👍 Like the video
💬 Share your thoughts in the comments
🔔 Subscribe for more content

🎮 More creator and gaming tools:
https://devtekgaming.github.io/creatorkit/

Thanks for supporting CreatorKit! ❤️

#youtube #creator #gaming #shorts #contentcreator`;


  const result =
    document.getElementById("result");


  result.innerHTML =
    description.replace(/\n/g, "<br>") +
    '<br><br><button class="copy-btn" onclick="copyResult()">📋 Copy Result</button>';

}


function copyResult() {

  const result =
    document.getElementById("result");

  const text =
    result.innerText
      .replace("📋 Copy Result", "")
      .trim();

  navigator.clipboard.writeText(text);

  const button =
    result.querySelector(".copy-btn");

  button.textContent =
    "✓ Copied!";

  setTimeout(() => {

    button.textContent =
      "📋 Copy Result";

  }, 1800);

}

</script>

</body>
</html>
