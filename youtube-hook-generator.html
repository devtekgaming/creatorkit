<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Free YouTube Hook Generator by CreatorKit. Create engaging hooks for YouTube videos and Shorts.">

  <title>YouTube Hook Generator — CreatorKit</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <div class="nav">
    <a class="logo" href="/creatorkit/">Creator<span>Kit</span></a>
    <a class="nav-btn" href="/creatorkit/">Home</a>
  </div>
</header>

<main>

<section class="tool-page">

  <div class="badge">🪝 FREE CREATOR TOOL</div>

  <h1>YouTube Hook Generator</h1>

  <p class="description">
    Create powerful hooks that grab attention in the first few seconds of your video.
  </p>

  <div class="card">

    <input
      id="topic"
      type="text"
      placeholder="e.g. gaming monitor"
    >

    <button onclick="generateHooks()">
      Generate Hooks
    </button>

    <div id="result" class="result"></div>

  </div>

</section>

</main>

<footer>
  <p>© 2026 CreatorKit · Free tools for creators</p>
</footer>


<script>

function generateHooks() {

  const input =
    document.getElementById("topic");

  const topic =
    input.value.trim() || "your topic";

  const hooks = [

    `🔥 "I tested ${topic} so you don't have to..."`,

    `😱 "Nobody tells you this about ${topic}..."`,

    `⚡ "Before you buy or try ${topic}, watch this!"`,

    `👀 "Wait until you see what happened with ${topic}..."`,

    `🚨 "This completely changed my experience with ${topic}..."`,

    `💡 "Here are 3 things you need to know about ${topic}..."`,

    `🎯 "If you're interested in ${topic}, don't make this mistake..."`

  ];

  const result =
    document.getElementById("result");

  result.innerHTML =
    hooks.join("<br><br>") +
    '<br><button class="copy-btn" onclick="copyResult()">📋 Copy Result</button>';

}


function copyResult() {

  const result =
    document.getElementById("result");

  const text =
    result.innerText
      .replace("📋 Copy Result", "")
      .trim();

  navigator.clipboard.writeText(text);

  const button =
    result.querySelector(".copy-btn");

  button.textContent = "✓ Copied!";

  setTimeout(() => {
    button.textContent = "📋 Copy Result";
  }, 1800);

}

</script>

</body>
</html>
