<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Free Instagram and social media Caption Generator by CreatorKit."
  >

  <title>Caption Generator — CreatorKit</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

<header>

  <div class="nav">

    <a class="logo" href="/creatorkit/">
      Creator<span>Kit</span>
    </a>

    <a class="nav-btn" href="/creatorkit/">
      Home
    </a>

  </div>

</header>


<main>

<section class="tool-page">

  <div class="badge">
    ✍️ FREE CREATOR TOOL
  </div>

  <h1>
    Caption Generator
  </h1>

  <p class="description">
    Generate engaging captions for Instagram posts, Reels, Shorts and social media.
  </p>


  <div class="card">

    <input
      id="topic"
      type="text"
      placeholder="e.g. new gaming setup"
    >

    <button onclick="generateCaptions()">
      Generate Captions
    </button>

    <div
      id="result"
      class="result"
    ></div>

  </div>

</section>

</main>


<footer>

  <p>
    © 2026 CreatorKit · Free tools for creators
  </p>

</footer>


<script>

function generateCaptions() {

  const topic =
    document
      .getElementById("topic")
      .value
      .trim() || "this moment";


  const captions = [

    `🔥 ${topic} and we're just getting started!`,

    `✨ New day. New content. New goals. 🚀`,

    `🎬 Behind the scenes of ${topic}.`,

    `⚡ Creating memories, one post at a time.`,

    `🚀 Just another step in the journey.`,

    `👀 Wait until you see what's coming next...`,

    `💯 Would you try ${topic}? Let me know!`,

    `🎯 Focused. Consistent. Creating.`

  ];


  const result =
    document.getElementById("result");


  result.innerHTML =
    captions.join("<br><br>") +
    '<br><button class="copy-btn" onclick="copyResult()">📋 Copy Result</button>';

}


function copyResult() {

  const result =
    document.getElementById("result");

  const text =
    result.innerText
      .replace("📋 Copy Result", "")
      .trim();

  navigator.clipboard.writeText(text);

  const button =
    result.querySelector(".copy-btn");

  button.textContent =
    "✓ Copied!";

  setTimeout(() => {

    button.textContent =
      "📋 Copy Result";

  }, 1800);

}

</script>

</body>
</html>
