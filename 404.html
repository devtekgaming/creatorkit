<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Page Not Found | CreatorKit</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #0b0b12;
      color: #fff;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 550px;
    }

    .number {
      font-size: 110px;
      font-weight: bold;
      color: #7c4dff;
      line-height: 1;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 30px;
      margin-bottom: 12px;
    }

    p {
      color: #aaa;
      line-height: 1.7;
      margin-bottom: 28px;
    }

    .btn {
      display: inline-block;
      padding: 14px 24px;
      border-radius: 10px;
      background: #7c4dff;
      color: #fff;
      text-decoration: none;
      font-weight: bold;
    }

    .btn:hover {
      background: #6938e8;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="number">404</div>

    <h1>Page Not Found</h1>

    <p>
      Sorry, the page you're looking for doesn't exist or may have been moved.
    </p>

    <a class="btn" href="/creatorkit/">
      ← Back to CreatorKit
    </a>

  </div>

</body>
</html>
